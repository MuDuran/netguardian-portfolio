[pytest]
# Collect only from tests/, so a stray test_*.py elsewhere in the tree cannot
# be picked up and executed during a run.
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --tb=short
    -ra

filterwarnings =
    ignore::DeprecationWarning:scapy.*
